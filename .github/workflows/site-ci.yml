name: Website CI

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/brand/**"
      - "README.md"
      - "README_RU.md"
      - "lib/BUMPSTER_LOGO.ASCII"
      - ".github/dependabot.yml"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "website/**"
      - "docs/brand/**"
      - "README.md"
      - "README_RU.md"
      - "lib/BUMPSTER_LOGO.ASCII"
      - ".github/dependabot.yml"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Verify Yarn Classic
        shell: bash
        run: |
          expected_version="$(
            node -p "require('./package.json').packageManager.replace(/^yarn@/, '')"
          )"
          actual_version="$(yarn --version)"

          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Expected Yarn %s, found %s.\n' \
              "$expected_version" \
              "$actual_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run lint
        run: yarn run lint

      - name: Check formatting
        run: yarn run format:check

      - name: Verify website content
        run: yarn run content:check

      - name: Build website
        run: yarn run build

      - name: Verify static output
        shell: bash
        run: |
          set -euo pipefail

          for required_file in \
            dist/index.html \
            dist/ru/index.html \
            dist/apple-touch-icon.png \
            dist/favicon-16.png \
            dist/favicon-32.png \
            dist/favicon.svg \
            dist/icon-192.png \
            dist/icon-512.png \
            dist/og-image.png \
            dist/robots.txt \
            dist/site.webmanifest \
            dist/sitemap.xml
          do
            if [[ ! -f "$required_file" ]]; then
              printf 'Missing website output: %s\n' "$required_file" >&2
              exit 1
            fi
          done

          if find dist -type l -print -quit | grep -q .; then
            printf 'Website output must not contain symbolic links.\n' >&2
            exit 1
          fi

          grep -Fq '/Bumpster/assets/' dist/index.html
          grep -Fq '/Bumpster/assets/' dist/ru/index.html

      - name: Verify built Bumpster version
        run: yarn run version:check

      - name: Check Lighthouse budgets
        shell: bash
        run: |
          set -euo pipefail

          chrome_path="$(
            command -v google-chrome ||
              command -v google-chrome-stable ||
              true
          )"

          if [[ -z "$chrome_path" ]]; then
            printf 'Google Chrome is not available on the runner.\n' >&2
            exit 1
          fi

          CHROME_PATH="$chrome_path" yarn run lighthouse
