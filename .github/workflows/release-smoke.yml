name: Release smoke

on:
  workflow_call:
    inputs:
      expected_tag:
        description: Expected latest stable Release tag
        required: false
        type: string
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Expected latest stable Release tag (optional)
        required: false
        type: string
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/release-smoke.yml"
      - "scripts/smoke-release.sh"

permissions:
  attestations: read
  contents: read

concurrency:
  group: release-smoke-${{ inputs.expected_tag || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Public Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify latest public Release
        shell: bash
        env:
          BUMPSTER_REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/smoke-release.sh
