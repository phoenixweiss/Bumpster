name: Website deployment

on:
  push:
    tags:
      - "website/v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Website release tag to deploy (website/vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Validate website release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/validate-release.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" main

      - name: Verify Yarn Classic
        shell: bash
        run: |
          expected_version="$(
            node -p "require('./package.json').packageManager.replace(/^yarn@/, '')"
          )"
          actual_version="$(yarn --version)"

          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Expected Yarn %s, found %s.\n' \
              "$expected_version" \
              "$actual_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run lint
        run: yarn run lint

      - name: Check formatting
        run: yarn run format:check

      - name: Verify website content
        run: yarn run content:check

      - name: Build website
        run: yarn run build

      - name: Verify built CLI and website versions
        run: yarn run version:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
