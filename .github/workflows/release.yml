name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Required checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="$GITHUB_REF_NAME"
          version="$(
            ./scripts/validate-release.sh \
              "$tag_name" \
              "$GITHUB_SHA" \
              main
          )"

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists.\n' "$tag_name" >&2
            exit 1
          fi

          {
            printf 'tag=%s\n' "$tag_name"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          ./scripts/release-notes.sh \
            "${{ steps.release.outputs.version }}" \
            > "$RUNNER_TEMP/changelog-notes.md"

      - name: Build runtime assets
        id: runtime
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets_dir="$RUNNER_TEMP/release-assets"
          archive_name="bumpster-$RELEASE_VERSION.tar.gz"

          ./scripts/build-runtime.sh "$assets_dir" "$GITHUB_SHA"

          {
            printf 'directory=%s\n' "$assets_dir"
            printf 'archive=%s\n' "$assets_dir/$archive_name"
            printf 'archive_name=%s\n' "$archive_name"
            printf 'checksums=%s\n' "$assets_dir/SHA256SUMS"
          } >> "$GITHUB_OUTPUT"

      - name: Verify runtime assets
        shell: bash
        env:
          ASSETS_DIR: ${{ steps.runtime.outputs.directory }}
          ARCHIVE_NAME: ${{ steps.runtime.outputs.archive_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd "$ASSETS_DIR"
          shasum -a 256 -c SHA256SUMS

          actual_assets="$(
            find . -maxdepth 1 -type f -exec basename {} \; |
              LC_ALL=C sort
          )"
          expected_assets="$(
            printf '%s\n' \
              "SHA256SUMS" \
              "$ARCHIVE_NAME"
          )"

          if [[ "$actual_assets" != "$expected_assets" ]]; then
            printf 'Runtime asset list does not match the whitelist.\n' >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          fi

          expected_contents="$(
            printf '%s\n' \
              "bumpster-$RELEASE_VERSION/" \
              "bumpster-$RELEASE_VERSION/LICENSE" \
              "bumpster-$RELEASE_VERSION/VERSION" \
              "bumpster-$RELEASE_VERSION/bumpster.sh" \
              "bumpster-$RELEASE_VERSION/config.sh" \
              "bumpster-$RELEASE_VERSION/lib/" \
              "bumpster-$RELEASE_VERSION/lib/BUMPSTER_LOGO.ASCII" \
              "bumpster-$RELEASE_VERSION/lib/functions.sh"
          )"
          actual_contents="$(tar -tzf "$ARCHIVE_NAME")"

          if [[ "$actual_contents" != "$expected_contents" ]]; then
            printf 'Runtime archive contents do not match the whitelist.\n' >&2
            printf '%s\n' "$actual_contents" >&2
            exit 1
          fi

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.runtime.outputs.archive }}

      - name: Verify build provenance
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.runtime.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "$ARCHIVE_PATH" \
            --repo "$GITHUB_REPOSITORY"

      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          release_body="$(<"$RUNNER_TEMP/changelog-notes.md")"

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$RELEASE_COMMIT" \
            --arg body "$release_body" \
            '{
              tag_name: $tag,
              target_commitish: $commit,
              name: ("Bumpster " + $version),
              body: $body,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
              make_latest: "false"
            }' > "$RUNNER_TEMP/release-payload.json"

          release_id="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input "$RUNNER_TEMP/release-payload.json" \
              --jq '.id'
          )"

          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload runtime assets
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.runtime.outputs.archive }}
          CHECKSUM_PATH: ${{ steps.runtime.outputs.checksums }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload \
            "$RELEASE_TAG" \
            "$ARCHIVE_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft release
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.runtime.outputs.archive_name }}
          CHECKSUM_PATH: ${{ steps.runtime.outputs.checksums }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          archive_digest="$(
            awk -v archive="$ARCHIVE_NAME" '
              $2 == archive {
                print "sha256:" $1
                found = 1
              }
              END {
                if (!found) {
                  exit 1
                }
              }
            ' "$CHECKSUM_PATH"
          )"
          checksum_digest="sha256:$(
            shasum -a 256 "$CHECKSUM_PATH" |
              awk '{print $1}'
          )"

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/draft-release.json"

          jq -e \
            --arg archive "$ARCHIVE_NAME" \
            --arg archive_digest "$archive_digest" \
            --arg checksum_digest "$checksum_digest" \
            --arg tag "$RELEASE_TAG" \
            '
              .draft == true and
              .prerelease == false and
              .tag_name == $tag and
              (.assets | length) == 2 and
              all(.assets[]; .state == "uploaded" and .size > 0) and
              (
                [.assets[] | {name, digest}] | sort_by(.name)
              ) ==
              (
                [
                  {name: $archive, digest: $archive_digest},
                  {name: "SHA256SUMS", digest: $checksum_digest}
                ] | sort_by(.name)
              )
            ' \
            "$RUNNER_TEMP/draft-release.json" >/dev/null

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          jq -n \
            '{
              draft: false,
              make_latest: "true"
            }' > "$RUNNER_TEMP/publish-payload.json"

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/publish-payload.json" \
            > "$RUNNER_TEMP/published-release.json"

          jq -e \
            '
              .draft == false and
              .prerelease == false and
              (.assets | length) == 2
            ' \
            "$RUNNER_TEMP/published-release.json" >/dev/null
          jq -r '.html_url' "$RUNNER_TEMP/published-release.json"

      - name: Report retained draft
        if: ${{ failure() && steps.draft.outputs.id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          draft_url="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '.html_url'
          )"
          printf 'Release publication failed. Draft retained: %s\n' "$draft_url"

  smoke:
    name: Verify public Release
    needs: publish
    permissions:
      attestations: read
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      expected_tag: ${{ github.ref_name }}

  homebrew:
    name: Request Homebrew update
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Dispatch Formula update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TAP_REPOSITORY: phoenixweiss/homebrew-bumpster
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            printf 'HOMEBREW_TAP_TOKEN is not configured.\n' >&2
            exit 1
          fi

          jq -n \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            '{
              event_type: "bumpster-release",
              client_payload: {
                repository: $repository,
                tag: $tag,
                commit: $commit
              }
            }' > "$RUNNER_TEMP/homebrew-dispatch.json"

          gh api \
            --method POST \
            "repos/$TAP_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/homebrew-dispatch.json"
