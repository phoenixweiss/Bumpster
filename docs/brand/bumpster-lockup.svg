<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 140" role="img" aria-labelledby="title description" style="color:#941e3d">
  <title id="title">Bumpster horizontal logo</title>
  <desc id="description">The Bumpster version counter mark paired with an outlined IBM Plex Mono wordmark.</desc>
  <metadata>
    Primary horizontal lockup.
    Mark geometry: three uppercase semantic-version cells with a structural caret bump.
    Wordmark source: IBM Plex Mono 2.3, Bold, converted to outlines.
    Optical pair spacing: BU +28, UM +28, MP +7, PS -30, ST -22, TE -53, ER -32 font units relative to the original 28-unit tracking. The lockup has no runtime font dependency.
    Wordmark cap height and baseline match the X.Y.Z glyphs.
    Change the root color property to recolor the complete lockup.
  </metadata>

