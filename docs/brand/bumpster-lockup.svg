    Mark geometry: three semantic-version cells with a structural caret bump.
    Wordmark source: Space Mono 5.3.0, weight 700, converted to outlines.
    Letter spacing: 28 font units. The lockup has no runtime font dependency.
    Change the root color property to recolor the complete lockup.
  </metadata>

