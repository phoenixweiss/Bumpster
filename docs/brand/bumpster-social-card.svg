<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Bumpster social card</title>
  <desc id="description">The Bumpster Flat lockup with a semantic-version grid and terminal release command.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d7d1c8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f3f0ea"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.72"/>
  <rect x="0" y="0" width="18" height="630" fill="#941e3d"/>

  <image href="bumpster-lockup.svg" x="90" y="92" width="1020" height="146"/>

  <rect x="90" y="316" width="1020" height="170" fill="#171717"/>
  <circle cx="126" cy="348" r="6" fill="#e7a06c"/>
  <circle cx="148" cy="348" r="6" fill="#d85a78"/>
  <circle cx="170" cy="348" r="6" fill="#5b8f7a"/>
  <text x="600" y="357" text-anchor="middle" fill="#8f8981" font-family="monospace" font-size="18">release.sh</text>
  <text x="132" y="432" fill="#f8f3eb" font-family="monospace" font-size="34" font-weight="700">$ bumpster --patch</text>

  <text x="90" y="555" fill="#706a64" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">SEMANTIC VERSIONING · GIT RELEASES · BASH</text>
</svg>
