<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" role="img" aria-labelledby="title description" style="color:#941e3d">
  <title id="title">Bumpster version counter mark</title>
  <desc id="description">Three uppercase semantic-version cells separated by dots, with a caret bump above the patch cell.</desc>
  <metadata>
    Primary flat mark for Bumpster.
    Geometry: three 72 by 92 cells on a 109-unit rhythm.
    The caret is structural and remains visible in single-ink applications.
    Change the root color property to recolor the complete mark.
  </metadata>

  <g fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="miter">
    <rect x="5" y="35" width="72" height="92"/>
    <rect x="114" y="35" width="72" height="92"/>
    <path d="M223 35H244L259 18L274 35H295V127H223Z"/>
  </g>

  <circle cx="96" cy="82" r="6" fill="currentColor"/>
  <circle cx="205" cy="82" r="6" fill="currentColor"/>

  <g fill="currentColor">
    <path transform="translate(18 108) scale(0.075 -0.075)" d="M176 700 294 414H318L436 700H579L435 360V342L579 0H436L318 288H294L176 0H33L177 342V360L33 700Z"/>
    <path transform="translate(127 108) scale(0.075 -0.075)" d="M240 246H210L9 700H153L297 366H315L459 700H603L402 246H372V0H240Z"/>
    <path transform="translate(236 108) scale(0.075 -0.075)" d="M53 700H551V484L155 144V126H563V0H47V216L443 556V574H53Z"/>
  </g>
</svg>
