<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">Bumpster flat and terminal identity sheet</title>
  <desc id="description">The Bumpster lockup, flat mark applications, size checks, and matching ASCII terminal logo.</desc>

  <defs>
    <filter id="ink-black" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 1 0"/>
    </filter>
    <filter id="ink-white" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 1 0"/>
    </filter>
    <filter id="sheet-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#171717" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="#dedbd5"/>

  <rect x="60" y="60" width="1680" height="370" rx="26" fill="#f3f0ea"/>
  <text x="108" y="122" fill="#706a64" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="3">PRIMARY FLAT LOCKUP</text>
  <image href="bumpster-lockup.svg" x="160" y="175" width="1480" height="212"/>

  <rect x="60" y="470" width="1000" height="670" rx="26" fill="#f3f0ea"/>
  <text x="108" y="532" fill="#706a64" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="3">FLAT MARK APPLICATIONS</text>

  <g transform="translate(108 575)">
    <rect width="264" height="238" rx="20" fill="#ebe6de"/>
    <image href="bumpster-mark.svg" x="34" y="48" width="196" height="92"/>
    <text x="132" y="194" text-anchor="middle" fill="#706a64" font-family="system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="2">BRAND</text>
  </g>

  <g transform="translate(404 575)">
    <rect width="264" height="238" rx="20" fill="#ffffff"/>
    <image href="bumpster-mark.svg" x="34" y="48" width="196" height="92" filter="url(#ink-black)"/>
    <text x="132" y="194" text-anchor="middle" fill="#706a64" font-family="system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="2">SINGLE INK</text>
  </g>

  <g transform="translate(700 575)">
    <rect width="264" height="238" rx="20" fill="#171717"/>
    <image href="bumpster-mark.svg" x="34" y="48" width="196" height="92" filter="url(#ink-white)"/>
    <text x="132" y="194" text-anchor="middle" fill="#f8f3eb" font-family="system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="2">REVERSE</text>
  </g>

  <text x="108" y="878" fill="#706a64" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="3">SIZE CHECK</text>
  <g transform="translate(108 926)" fill="#706a64" font-family="system-ui, sans-serif" font-size="18">
    <image href="bumpster-mark.svg" x="0" y="0" width="256" height="120"/>
    <text x="128" y="152" text-anchor="middle">256 px</text>
    <image href="bumpster-mark.svg" x="322" y="30" width="128" height="60"/>
    <text x="386" y="152" text-anchor="middle">128 px</text>
    <image href="bumpster-mark.svg" x="526" y="45" width="64" height="30"/>
    <text x="558" y="152" text-anchor="middle">64 px</text>
    <image href="bumpster-mark.svg" x="682" y="52" width="32" height="15"/>
    <text x="698" y="152" text-anchor="middle">32 px</text>
    <image href="bumpster-mark.svg" x="830" y="56" width="16" height="8"/>
    <text x="838" y="152" text-anchor="middle">16 px</text>
  </g>

  <rect x="1100" y="470" width="640" height="670" rx="26" fill="#171717"/>
  <text x="1148" y="532" fill="#bdb5aa" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="3">TERMINAL MASTER</text>

  <g transform="translate(1148 620)" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700" fill="#f8f3eb" xml:space="preserve">
    <text y="0">+---+ +---+ +-<tspan fill="#e7a06c">^</tspan>-+</text>
    <text y="46">| x |.| y |.| z |  BUMPSTER</text>
    <text y="92">+---+ +---+ +---+</text>
  </g>

  <line x1="1148" y1="775" x2="1692" y2="775" stroke="#423d38" stroke-width="2"/>
  <text x="1148" y="828" fill="#bdb5aa" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">NO_COLOR=1</text>
  <g transform="translate(1148 900)" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700" fill="#f8f3eb" xml:space="preserve">
    <text y="0">+---+ +---+ +-^-+</text>
    <text y="46">| x |.| y |.| z |  BUMPSTER</text>
    <text y="92">+---+ +---+ +---+</text>
  </g>

  <g transform="translate(1148 1050)" fill="#bdb5aa" font-family="system-ui, sans-serif" font-size="18">
    <text>7-bit ASCII</text>
    <text x="170">27 columns</text>
    <text x="348">3 lines</text>
  </g>
</svg>
